# /etc/nginx/conf.d/notwhat.conf
#
# Install this, reload nginx, then run certbot --nginx. Certbot rewrites the
# server block to listen on 443, adds the certificate directives, and creates
# the port 80 -> 443 redirect.
#
# Replace api.yourdomain.com with your real hostname before installing.

server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;

    # Video uploads. multer caps individual files in
    # src/modules/uploads/upload.middleware.js; this is the outer envelope.
    client_max_body_size 200M;

    # Stream the body straight through to Node rather than spooling the whole
    # upload to nginx's disk first.
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # src/server.js sets keepAliveTimeout to 65s to work around iOS Darwin
        # connection reuse (-1005). nginx's 60s default would fire first and
        # reintroduce exactly that error, so both read and send run long enough
        # to cover a synchronous HLS transcode.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
