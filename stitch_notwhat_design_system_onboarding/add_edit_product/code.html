<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }

        /* Custom Toggle Style */
        .toggle-checkbox:checked + .toggle-label {
            background-color: #ff571a;
        }
        .toggle-checkbox:checked + .toggle-label .toggle-dot {
            transform: translateX(100%);

        /* Input Glow Focus */
        .input-glow:focus {

    body {

<body class="bg-background text-on-background font-body-md selection:bg-primary-container selection:text-on-primary-container min-h-screen overflow-x-hidden flex justify-center">
<!-- Mobile Container (iPhone 14 Pro Max simulation) -->
<main class="w-full max-w-[430px] bg-background min-h-screen relative shadow-2xl flex flex-col pb-32">
<!-- TopAppBar -->
<header class="fixed top-0 max-w-[430px] w-full z-50 bg-background flex justify-between items-center px-margin h-16">
<button class="active:scale-95 transition-transform duration-150 hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold tracking-tighter text-primary">ADD PRODUCT</h1>
<button class="active:scale-95 transition-transform duration-150 hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-primary">more_vert</span>
</button>
</header>
<!-- Scrollable Form Content -->
<div class="mt-16 flex-1 px-margin space-y-xl pt-md">
<!-- 5 Image Upload Slots -->
<section>
<label class="font-label-md text-label-md text-on-surface-variant mb-sm block">PRODUCT MEDIA (MAX 5)</label>
<div class="flex gap-gutter overflow-x-auto hide-scrollbar snap-x py-base">
<!-- Main Image Slot -->
<div class="relative flex-shrink-0 w-40 h-52 bg-surface-container rounded-lg border-2 border-dashed border-primary-container flex flex-col items-center justify-center snap-start group overflow-hidden">
<div class="absolute top-2 left-2 bg-primary-container text-on-primary-container text-[10px] font-bold px-2 py-0.5 rounded-full z-10">MAIN</div>
<span class="material-symbols-outlined text-primary text-4xl mb-2">add_a_photo</span>
<p class="text-[10px] font-bold text-primary">UPLOAD COVER</p>
<img class="absolute inset-0 w-full h-full object-cover opacity-30 group-hover:opacity-50 transition-opacity" data-alt="A cinematic, high-fashion studio shot of a sleek designer sneaker placed on a reflective black surface. The lighting is dramatic, with neon orange accents slicing through the shadows, creating a high-contrast Gen-Z street culture aesthetic. Professional product photography with sharp details and deep blacks in a void-like environment." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBLeAlmxdIWF_TnMEGp-Pk1m-OlK_Ryt80yVT61FB72vAJIxAfOYXXmJ4JOnNinDHH9r5D5ytuCMef2t-sVAk96oBZ3jroCgmiZNmqaJYSLYUPdw8XKeDUA8xsBH7fXSJZGhDO3ce3RGehDkl1uwffemnDURywEeSeLDhaF8_5gyuTWpcaBvQkolrnhuEEif-rznXoMKFJRCe9pf0ylU_LR09LZQOfvUnXOkKqBw_I8c1Zc0W7LX0WwKz-nDvKavia4Jy3jpVGXTbs"/>
</div>
<!-- Secondary Slots -->
<div class="flex-shrink-0 w-28 h-52 bg-surface-container rounded-lg border border-outline-variant flex flex-col items-center justify-center snap-start">
<span class="material-symbols-outlined text-outline text-2xl">add</span>
</div>
<div class="flex-shrink-0 w-28 h-52 bg-surface-container rounded-lg border border-outline-variant flex flex-col items-center justify-center snap-start">
<span class="material-symbols-outlined text-outline text-2xl">add</span>
</div>
<div class="flex-shrink-0 w-28 h-52 bg-surface-container rounded-lg border border-outline-variant flex flex-col items-center justify-center snap-start">
<span class="material-symbols-outlined text-outline text-2xl">add</span>
</div>
<div class="flex-shrink-0 w-28 h-52 bg-surface-container rounded-lg border border-outline-variant flex flex-col items-center justify-center snap-start">
<span class="material-symbols-outlined text-outline text-2xl">add</span>
</div>
</div>
</section>
<!-- Basic Info -->
<section class="space-y-md">
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-1">PRODUCT NAME</label>
<input class="w-full bg-surface-container-low border-outline-variant rounded-md px-md py-3 text-on-surface focus:ring-0 input-glow transition-all outline-none" placeholder="e.g. Cyber-Punk Oversized Hoodie" type="text"/>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-1">DESCRIPTION</label>
<textarea class="w-full bg-surface-container-low border-outline-variant rounded-md px-md py-3 text-on-surface focus:ring-0 input-glow transition-all outline-none resize-none" placeholder="Tell the story of this piece..." rows="4"></textarea>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-1">CATEGORY</label>
<div class="relative">
<select class="w-full appearance-none bg-surface-container-low border-outline-variant rounded-md px-md py-3 text-on-surface focus:ring-0 input-glow transition-all outline-none pr-10">
<option>Streetwear</option>
<option>Techwear</option>
<option>Vintage</option>
<option>Accessories</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-outline">expand_more</span>
</div>
</div>
</section>
<!-- Pricing Section -->
<section class="grid grid-cols-2 gap-md">
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-1">PRICE (₹)</label>
<input class="w-full bg-surface-container-low border-outline-variant rounded-md px-md py-3 text-on-surface focus:ring-0 input-glow transition-all outline-none" placeholder="2499" type="number"/>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-1">COMPARE AT (₹)</label>
<input class="w-full bg-surface-container-low border-outline-variant rounded-md px-md py-3 text-on-surface focus:ring-0 input-glow transition-all outline-none opacity-60" placeholder="3999" type="number"/>
</div>
</section>
<!-- Inventory Section -->
<section class="grid grid-cols-2 gap-md">
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-1">SKU</label>
<input class="w-full bg-surface-container-low border-outline-variant rounded-md px-md py-3 text-on-surface focus:ring-0 input-glow transition-all outline-none font-mono text-xs" placeholder="SHOE-001-BLK" type="text"/>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-1">STOCK QTY</label>
<input class="w-full bg-surface-container-low border-outline-variant rounded-md px-md py-3 text-on-surface focus:ring-0 input-glow transition-all outline-none" placeholder="50" type="number"/>
</div>
</section>
<!-- Variants -->
<section class="space-y-md">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant">VARIANTS</label>
<button class="text-primary font-label-md flex items-center gap-1 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[16px]">add_circle</span>
                        ADD NEW
                    </button>
</div>
<div class="space-y-sm">
<p class="text-caption text-outline uppercase tracking-widest">SIZES</p>
<div class="flex flex-wrap gap-sm">
<span class="bg-primary-container text-on-primary-container px-4 py-1.5 rounded-full font-label-md text-label-md border border-primary-container">S</span>
<span class="bg-surface-container text-on-surface px-4 py-1.5 rounded-full font-label-md text-label-md border border-outline-variant">M</span>
<span class="bg-surface-container text-on-surface px-4 py-1.5 rounded-full font-label-md text-label-md border border-outline-variant">L</span>
<span class="bg-surface-container text-on-surface px-4 py-1.5 rounded-full font-label-md text-label-md border border-outline-variant">XL</span>
</div>
</div>
<div class="space-y-sm">
<p class="text-caption text-outline uppercase tracking-widest">COLORS</p>
<div class="flex flex-wrap gap-sm">
<div class="flex items-center gap-2 bg-surface-container-high px-3 py-1.5 rounded-full border border-primary">
<div class="w-3 h-3 rounded-full bg-black border border-outline-variant"></div>
<span class="font-label-md text-label-md text-on-surface">VOID BLACK</span>
</div>
<div class="flex items-center gap-2 bg-surface-container px-3 py-1.5 rounded-full border border-outline-variant opacity-60">
<div class="w-3 h-3 rounded-full bg-white"></div>
<span class="font-label-md text-label-md text-on-surface">CHROME</span>
</div>
</div>
</div>
</section>
<!-- Bargain Mode Toggle -->
<section class="p-md bg-surface-container rounded-xl border border-outline-variant/30 space-y-md">
<div class="flex justify-between items-center">
<div class="flex items-center gap-3">
<div class="bg-primary-container/20 p-2 rounded-lg">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">gavel</span>
</div>
<div>
<h3 class="font-label-md text-label-md text-on-surface">BARGAIN MODE</h3>
<p class="text-[10px] text-on-surface-variant">Allow users to place bids</p>
</div>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only toggle-checkbox" type="checkbox"/>
<div class="toggle-label w-11 h-6 bg-surface-container-highest rounded-full transition-colors relative">
<div class="toggle-dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform"></div>
</div>
</label>
</div>
<div class="pt-sm border-t border-outline-variant/20 space-y-xs" id="bargain-details">
<label class="font-label-md text-label-md text-on-surface-variant ml-1">MINIMUM ACCEPTABLE BID (₹)</label>
<div class="relative">
<span class="absolute left-md top-1/2 -translate-y-1/2 text-primary font-bold">₹</span>
<input class="w-full bg-background border-outline-variant rounded-md pl-10 pr-md py-3 text-on-surface focus:ring-0 input-glow transition-all outline-none" type="number" value="1800"/>
</div>
<p class="text-[10px] text-outline italic ml-1">*Bids below this price will be automatically rejected.</p>
</div>
</section>
</div>
<!-- Sticky Bottom Action -->
<div class="fixed bottom-0 max-w-[430px] w-full bg-background/90 backdrop-blur-xl p-margin pb-safe z-50">
<button class="w-full bg-primary-container text-on-primary-container py-4 rounded-lg font-headline-sm text-headline-sm flex items-center justify-center gap-2 active:scale-[0.98] transition-transform shadow-lg shadow-primary-container/20">
<span class="material-symbols-outlined">bolt</span>
                PUBLISH NOW
            </button>
</div>
</main>
<!-- Micro-interactions Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggle = document.querySelector('.toggle-checkbox');
            const bargainDetails = document.getElementById('bargain-details');

            toggle.addEventListener('change', (e) => {
                if (e.target.checked) {
                    bargainDetails.style.opacity = '1';
                    bargainDetails.style.pointerEvents = 'auto';
                    bargainDetails.style.display = 'block';
                } else {
                    bargainDetails.style.opacity = '0.3';
                    bargainDetails.style.pointerEvents = 'none';
                }
            });

            // Smooth numeric animation for value fields could be added here
        });
    </script>
</body></html>
