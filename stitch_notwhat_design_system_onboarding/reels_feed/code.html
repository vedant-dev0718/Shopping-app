<style>

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

        }

        .scrolling-text {

<body class="bg-background text-on-background font-body-md overflow-hidden select-none">

</header>
<!-- Right Side Action Stack -->
<aside class="absolute right-md bottom-32 z-50 flex flex-col items-center gap-lg">
<!-- Profile -->

<div class="w-12 h-12 rounded-full border-2 border-white overflow-hidden">

</main>
<script>
        // Simple micro-interaction for the Like button
        const likeBtn = document.querySelector('aside button:nth-child(2)');
        let liked = false;
        likeBtn.addEventListener('click', () => {
            liked = !liked;
            const icon = likeBtn.querySelector('.material-symbols-outlined');
            icon.style.color = liked ? '#ff571a' : '#ffffff';
            icon.style.transform = 'scale(1.2)';
            setTimeout(() => icon.style.transform = 'scale(1)', 150);
            
            const count = likeBtn.querySelector('span:last-child');
            count.textContent = liked ? '12.5K' : '12.4K';
        });

        // Shop button click effect
        const shopBtn = document.querySelector('button.bg-primary-container');
        shopBtn.addEventListener('click', () => {
            shopBtn.classList.add('brightness-125');
            setTimeout(() => shopBtn.classList.remove('brightness-125'), 200);
        });

        // Vertical drag simulate (visual only)
        let startY;
        document.addEventListener('touchstart', e => startY = e.touches[0].pageY);
        document.addEventListener('touchend', e => {
            const endY = e.changedTouches[0].pageY;
            if (startY - endY > 100) {
                // Swipe up
                document.body.style.opacity = '0';
                setTimeout(() => {
                    document.body.style.opacity = '1';
                }, 300);
            }
        });
    </script>
