<script>
        // Micro-interactions for category selection
        const categoryCards = document.querySelectorAll('.category-card');
        categoryCards.forEach(card => {
            card.addEventListener('click', () => {
                categoryCards.forEach(c => {
                    c.classList.remove('bg-primary/20', 'border-primary', 'text-primary');
                    c.classList.add('bg-surface-container', 'border-outline-variant/30', 'text-on-surface');
                    c.querySelector('.material-symbols-outlined').classList.remove('fill-icon');
                });
                card.classList.remove('bg-surface-container', 'border-outline-variant/30', 'text-on-surface');
                card.classList.add('bg-primary/20', 'border-primary', 'text-primary');
                card.querySelector('.material-symbols-outlined').classList.add('fill-icon');
            });
        });

        // Simple Drawer Logic (Can be triggered via menu if added)
        const openDrawer = () => {
            document.getElementById('drawer').classList.remove('pointer-events-none');
            document.getElementById('drawer-overlay').classList.add('opacity-100');
            document.getElementById('drawer-content').classList.remove('-translate-x-full');
        };

        const closeDrawer = () => {
            document.getElementById('drawer-overlay').classList.remove('opacity-100');
            document.getElementById('drawer-content').classList.add('-translate-x-full');
            setTimeout(() => {
                document.getElementById('drawer').classList.add('pointer-events-none');
            }, 300);
        };

        document.getElementById('drawer-overlay').addEventListener('click', closeDrawer);
    </script>
