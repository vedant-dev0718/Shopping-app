<script>
        // Simple Interaction logic for demo purposes
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function() {
                const icon = this.querySelector('.material-symbols-outlined');
                if(icon) {
                    this.classList.add('scale-95');
                    setTimeout(() => this.classList.remove('scale-95'), 150);
                }
            });
        });

        // Floating particle effect for "Void" aesthetic
        const canvas = document.createElement('canvas');
        canvas.classList.add('fixed', 'inset-0', '-z-10', 'pointer-events-none', 'opacity-30');
        document.body.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        let particles = [];

        function initParticles() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles = [];
            for (let i = 0; i < 30; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2,
                    speedY: Math.random() * -0.5,
                    opacity: Math.random()
                });
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.y += p.speedY;
                if (p.y < 0) p.y = canvas.height;
                ctx.fillStyle = `rgba(255, 77, 0, ${p.opacity})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            requestAnimationFrame(animateParticles);
        }

        window.addEventListener('resize', initParticles);
        initParticles();
        animateParticles();
    </script>
