<!-- Dynamic Overlay for Search Focus (Hidden by default) -->
<div class="fixed inset-0 bg-black/70 z-40 hidden backdrop-blur-sm pointer-events-none" id="search-overlay"></div>
<script>
        // Micro-interactions for search focus
        const searchInput = document.querySelector('input');
        const overlay = document.getElementById('search-overlay');
        
        searchInput.addEventListener('focus', () => {
            overlay.classList.remove('hidden');
        });
        
        searchInput.addEventListener('blur', () => {
            overlay.classList.add('hidden');
        });

        // Tab selection logic
        const tabs = document.querySelectorAll('.flex.overflow-x-auto button');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => {
                    t.classList.remove('text-primary');
                    t.classList.add('text-on-surface-variant');
                    const underline = t.querySelector('div');
                    if (underline) underline.remove();
                });
                tab.classList.add('text-primary');
                tab.classList.remove('text-on-surface-variant');
                const underline = document.createElement('div');
                underline.className = 'absolute bottom-0 left-0 w-full h-[2px] bg-primary-container';
                tab.appendChild(underline);
            });
        });
    </script>
