<body class="void-bg min-h-screen flex flex-col justify-between font-body-md">
<!-- Top Navigation Anchor (As per JSON hierarchy) -->

<span class="material-symbols-outlined text-primary cursor-pointer hover:opacity-80 transition-opacity" data-icon="arrow_back">arrow_back</span>
</div>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary tracking-tighter uppercase">NotWhat</h1>
<div class="w-6"></div> <!-- Spacer for center alignment -->
</header>
<!-- Main Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-margin pt-24 pb-12">
<!-- Animated Icon Cluster -->
<div class="relative mb-10">
<div class="w-24 h-24 rounded-full bg-primary-container flex items-center justify-center glow-effect">
<span class="material-symbols-outlined text-on-primary-container text-[48px]" data-icon="mark_email_unread" style="font-variation-settings: 'FILL' 1;">mark_email_unread</span>
</div>
<!-- Decorative atmospheric dots -->

</div>
<!-- Typography Cluster -->

<p class="font-body-md text-on-surface-variant max-w-[280px] mx-auto">

</p>
</div>
<!-- OTP Input Component -->

<input class="otp-input w-full h-14 bg-surface-container-lowest border-1.5 border-surface-container-highest rounded-lg text-center text-display-lg-mobile font-display-lg-mobile text-primary transition-all focus:bg-surface-container-low" maxlength="1" type="number"/>
<input class="otp-input w-full h-14 bg-surface-container-lowest border-1.5 border-surface-container-highest rounded-lg text-center text-display-lg-mobile font-display-lg-mobile text-primary transition-all focus:bg-surface-container-low" maxlength="1" type="number"/>
<input class="otp-input w-full h-14 bg-surface-container-lowest border-1.5 border-surface-container-highest rounded-lg text-center text-display-lg-mobile font-display-lg-mobile text-primary transition-all focus:bg-surface-container-low" maxlength="1" type="number"/>
<input class="otp-input w-full h-14 bg-surface-container-lowest border-1.5 border-surface-container-highest rounded-lg text-center text-display-lg-mobile font-display-lg-mobile text-primary transition-all focus:bg-surface-container-low" maxlength="1" type="number"/>
<input class="otp-input w-full h-14 bg-surface-container-lowest border-1.5 border-surface-container-highest rounded-lg text-center text-display-lg-mobile font-display-lg-mobile text-primary transition-all focus:bg-surface-container-low" maxlength="1" type="number"/>

                Resend Code <span class="ml-1 text-on-surface-variant" id="timer">(00:59)</span>

</footer>
<script>
        // OTP Auto-focus logic
        const inputs = document.querySelectorAll('.otp-input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length > 1) {
                    e.target.value = e.target.value.slice(0, 1);
                }
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        // Simple Countdown Timer Logic
        let timeLeft = 59;
        const timerElement = document.getElementById('timer');
        const resendBtn = document.getElementById('resend-btn');

        const countdown = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerElement.innerText = "";
                resendBtn.disabled = false;
            } else {
                const seconds = timeLeft < 10 ? `0${timeLeft}` : timeLeft;
                timerElement.innerText = `(00:${seconds})`;
                resendBtn.disabled = true;
            }
            timeLeft -= 1;
        }, 1000);
    </script>
