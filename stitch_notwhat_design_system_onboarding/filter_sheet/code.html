<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Simple logic for toggle buttons to show state
            const discountButtons = document.querySelectorAll('button.rounded-full');
            discountButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    discountButtons.forEach(b => {
                        b.classList.remove('bg-primary-container', 'text-white');
                        b.classList.add('bg-surface-container', 'text-on-surface');
                    });
                    btn.classList.add('bg-primary-container', 'text-white');
                    btn.classList.remove('bg-surface-container', 'text-on-surface');
                });
            });

            // "Apply Filters" vibration feedback simulation
            const applyBtn = document.querySelector('button.bg-primary-container');
            applyBtn.addEventListener('click', () => {
                applyBtn.classList.add('animate-pulse');
                setTimeout(() => {
                    applyBtn.classList.remove('animate-pulse');
                    console.log('Filters Applied');
                }, 400);
            });
        });
    </script>
