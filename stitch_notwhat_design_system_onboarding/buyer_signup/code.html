<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>

                        "primary-container": "#ff571a",
                        "on-tertiary-container": "#002a53",
                        "tertiary-fixed": "#d4e3ff",
                        "surface-tint": "#ffb59e",
                        "surface-container": "#2d1b16",
                        "on-secondary": "#2f3131",
                        "surface-container-lowest": "#190a06",
                        "primary-fixed-dim": "#ffb59e",

                        "on-primary-container": "#521300",
                        "secondary-fixed-dim": "#c6c6c7",
                        "on-surface": "#fcdcd3",
                        "on-error-container": "#ffdad6",

                        "error": "#ffb4ab",

                        "surface-variant": "#44302a",

                        "tertiary-fixed-dim": "#a5c8ff",

                    "spacing": {

                        "lg": "24px",
                        "md": "16px",
                        "gutter": "12px",
                        "xl": "32px",
                        "sm": "8px",
                        "xs": "4px",
                        "margin": "16px"
                    },
                    "fontFamily": {

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #0A0A0A;
            color: #fcdcd3;
            overflow-x: hidden;
        }
        .focus-glow:focus-within {
            box-shadow: 0px 0px 8px #FF4D00;
            border-color: #FF4D00 !important;
        }
        .transition-all {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background font-body-md text-on-background min-h-screen flex flex-col">
<!-- Top AppBar (Identity Anchor) -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin h-16 bg-background">
<div class="flex items-center">
<span class="material-symbols-outlined text-primary cursor-pointer hover:opacity-80 transition-opacity" style="font-size: 24px;">menu</span>
</div>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary tracking-tighter uppercase">NotWhat</h1>
<div class="flex items-center">
<span class="material-symbols-outlined text-primary cursor-pointer hover:opacity-80 transition-opacity" style="font-size: 24px;">notifications</span>
</div>
</header>
<main class="flex-grow pt-24 pb-12 px-margin flex flex-col max-w-[390px] mx-auto w-full">
<!-- Progress Indicator -->
<div class="flex justify-between items-center mb-xl relative">
<!-- Background Line -->
<div class="absolute top-1/2 left-0 w-full h-[1px] bg-outline-variant -translate-y-1/2 z-0"></div>
<!-- Step 1: Account (Active) -->
<div class="z-10 flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container font-label-md">1</div>
<span class="font-label-md text-label-md text-primary">Account</span>
</div>
<!-- Step 2: Personal -->
<div class="z-10 flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-surface-container-highest border border-outline-variant flex items-center justify-center text-on-surface-variant font-label-md">2</div>
<span class="font-label-md text-label-md text-on-surface-variant">Personal</span>
</div>
<!-- Step 3: Verify -->
<div class="z-10 flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-surface-container-highest border border-outline-variant flex items-center justify-center text-on-surface-variant font-label-md">3</div>
<span class="font-label-md text-label-md text-on-surface-variant">Verify</span>
</div>
</div>
<!-- Headline Area -->
<div class="mb-lg">
<h2 class="font-headline-md text-headline-md text-on-background mb-base">Join the Culture</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Create your buyer account to start bargaining and shopping the latest drops.</p>
</div>
<!-- Form Fields -->
<form class="flex flex-col gap-md">
<!-- Full Name -->
<div class="group">
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs ml-1">Full Name</label>
<div class="flex items-center bg-[#1A1A1A] border border-[#2A2A2A] rounded-DEFAULT px-md py-3 focus-glow transition-all">
<span class="material-symbols-outlined text-outline mr-sm" style="font-size: 20px;">person</span>
<input class="bg-transparent border-none focus:ring-0 w-full text-on-background placeholder:text-[#8A8A8A] font-body-md" placeholder="e.g. Aryan Sharma" type="text"/>
</div>
</div>
<!-- Email -->
<div class="group">
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs ml-1">Email Address</label>
<div class="flex items-center bg-[#1A1A1A] border border-[#2A2A2A] rounded-DEFAULT px-md py-3 focus-glow transition-all">
<span class="material-symbols-outlined text-outline mr-sm" style="font-size: 20px;">mail</span>
<input class="bg-transparent border-none focus:ring-0 w-full text-on-background placeholder:text-[#8A8A8A] font-body-md" placeholder="aryan@notwhat.com" type="email"/>
</div>
</div>
<!-- Phone Number -->
<div class="group">
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs ml-1">Phone Number</label>
<div class="flex items-center bg-[#1A1A1A] border border-[#2A2A2A] rounded-DEFAULT px-md py-3 focus-glow transition-all">
<span class="material-symbols-outlined text-outline mr-sm" style="font-size: 20px;">call</span>
<input class="bg-transparent border-none focus:ring-0 w-full text-on-background placeholder:text-[#8A8A8A] font-body-md" placeholder="+91 00000 00000" type="tel"/>
</div>
</div>
<!-- Password -->
<div class="group">
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs ml-1">Password</label>
<div class="flex items-center bg-[#1A1A1A] border border-[#2A2A2A] rounded-DEFAULT px-md py-3 focus-glow transition-all">
<span class="material-symbols-outlined text-outline mr-sm" style="font-size: 20px;">lock</span>
<input class="bg-transparent border-none focus:ring-0 w-full text-on-background placeholder:text-[#8A8A8A] font-body-md" placeholder="••••••••" type="password"/>
<span class="material-symbols-outlined text-outline ml-sm cursor-pointer" style="font-size: 20px;">visibility_off</span>
</div>
</div>
<!-- Confirm Password -->
<div class="group">
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs ml-1">Confirm Password</label>
<div class="flex items-center bg-[#1A1A1A] border border-[#2A2A2A] rounded-DEFAULT px-md py-3 focus-glow transition-all">
<span class="material-symbols-outlined text-outline mr-sm" style="font-size: 20px;">lock_reset</span>
<input class="bg-transparent border-none focus:ring-0 w-full text-on-background placeholder:text-[#8A8A8A] font-body-md" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start gap-sm mt-xs px-1">
<div class="relative flex items-center mt-1">
<input class="w-5 h-5 rounded bg-[#1A1A1A] border-[#2A2A2A] text-primary-container focus:ring-offset-background focus:ring-primary-container" id="terms" type="checkbox"/>
</div>
<label class="font-caption text-on-surface-variant leading-tight" for="terms">
                    I agree to the <span class="text-primary font-semibold">Terms of Service</span> and <span class="text-primary font-semibold">Privacy Policy</span>.
                </label>
</div>
<!-- Primary Action -->
<button class="mt-md w-full bg-[#FF4D00] text-white font-headline-sm text-headline-sm py-4 rounded-full active:scale-95 transition-all shadow-lg shadow-primary-container/20" type="submit">
                Create Buyer Account
            </button>
</form>
<!-- Divider -->
<div class="flex items-center gap-md my-xl">
<div class="flex-grow h-[1px] bg-outline-variant"></div>
<span class="font-label-md text-label-md text-on-surface-variant">OR CONTINUE WITH</span>
<div class="flex-grow h-[1px] bg-outline-variant"></div>
</div>
<!-- Social Login -->
<button class="w-full bg-[#1A1A1A] border border-[#2A2A2A] text-on-background font-body-lg text-body-lg py-4 rounded-full flex items-center justify-center gap-sm active:scale-95 transition-all">
<svg class="w-5 h-5" fill="currentColor" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
            Sign up with Google
        </button>
<!-- Footer Link -->
<p class="mt-xl text-center font-body-md text-body-md text-on-surface-variant">
            Already have an account? <span class="text-primary font-bold cursor-pointer hover:underline">Log In</span>
</p>
</main>
<!-- Visual Element (Atmospheric Glow) -->
<div class="fixed bottom-0 right-0 w-64 h-64 bg-primary-container/10 blur-[120px] -z-10 rounded-full"></div>
<div class="fixed top-0 left-0 w-64 h-64 bg-tertiary-container/5 blur-[120px] -z-10 rounded-full"></div>
<script>
        // Micro-interactions for input focus
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('border-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('border-primary');
            });
        });

        // Toggle Password Visibility Logic
        const togglePass = document.querySelector('.material-symbols-outlined.cursor-pointer');
        if (togglePass) {
            togglePass.addEventListener('click', function() {
                const input = this.previousElementSibling;
                if (input.type === 'password') {
                    input.type = 'text';
                    this.textContent = 'visibility';
                    this.classList.add('text-primary');
                } else {
                    input.type = 'password';
                    this.textContent = 'visibility_off';
                    this.classList.remove('text-primary');
                }
            });
        }
    </script>
</body></html>
