<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-primary-fixed-variant": "#852400",
                    "on-primary-fixed": "#3a0b00",
                    "on-tertiary-fixed": "#001c3a",
                    "on-secondary-fixed": "#1a1c1c",
                    "tertiary-container": "#2492ff",
                    "surface": "#1f0f0b",
                    "surface-bright": "#49342e",
                    "on-tertiary-fixed-variant": "#004785",
                    "inverse-surface": "#fcdcd3",
                    "on-secondary-container": "#b4b5b5",
                    "surface-dim": "#1f0f0b",
                    "on-tertiary": "#00315e",
                    "inverse-on-surface": "#3f2c26",
                    "surface-container-low": "#281712",
                    "tertiary": "#a5c8ff",
                    "primary-container": "#ff571a",
                    "on-tertiary-container": "#002a53",
                    "tertiary-fixed": "#d4e3ff",
                    "surface-tint": "#ffb59e",
                    "surface-container": "#2d1b16",
                    "on-secondary": "#2f3131",
                    "surface-container-lowest": "#190a06",
                    "primary-fixed-dim": "#ffb59e",
                    "outline": "#ad897e",
                    "on-secondary-fixed-variant": "#454747",
                    "on-primary-container": "#521300",
                    "secondary-fixed-dim": "#c6c6c7",
                    "on-surface": "#fcdcd3",
                    "on-error-container": "#ffdad6",
                    "secondary-container": "#454747",
                    "primary": "#ffb59e",
                    "error": "#ffb4ab",
                    "on-primary": "#5e1700",
                    "error-container": "#93000a",
                    "outline-variant": "#5c4037",
                    "surface-container-highest": "#44302a",
                    "surface-variant": "#44302a",
                    "secondary": "#c6c6c7",
                    "on-error": "#690005",
                    "on-surface-variant": "#e6beb2",
                    "primary-fixed": "#ffdbd0",
                    "background": "#1f0f0b",
                    "surface-container-high": "#382620",
                    "tertiary-fixed-dim": "#a5c8ff",
                    "on-background": "#fcdcd3",
                    "inverse-primary": "#ae3200",
                    "secondary-fixed": "#e2e2e2"
            },
            "borderRadius": {
                    "DEFAULT": "1rem",
                    "lg": "2rem",
                    "xl": "3rem",
                    "full": "9999px"
            },
            "spacing": {
                    "base": "4px",
                    "lg": "24px",
                    "md": "16px",
                    "gutter": "12px",
                    "xl": "32px",
                    "sm": "8px",
                    "xs": "4px",
                    "margin": "16px"
            },
            "fontFamily": {
                    "body-lg": ["Inter", "sans-serif"],
                    "display-lg": ["Montserrat", "sans-serif"],
                    "headline-md": ["Montserrat", "sans-serif"],
                    "body-md": ["Inter", "sans-serif"],
                    "label-md": ["Inter", "sans-serif"],
                    "display-lg-mobile": ["Montserrat", "sans-serif"],
                    "headline-sm": ["Montserrat", "sans-serif"],
                    "caption": ["Inter", "sans-serif"]
            },
            "fontSize": {
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "display-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-md": ["24px", {"lineHeight": "30px", "fontWeight": "700"}],
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "label-md": ["12px", {"lineHeight": "16px", "fontWeight": "600"}],
                    "display-lg-mobile": ["28px", {"lineHeight": "34px", "fontWeight": "700"}],
                    "headline-sm": ["20px", {"lineHeight": "26px", "fontWeight": "700"}],
                    "caption": ["11px", {"lineHeight": "14px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #0A0A0A;
            color: #fcdcd3;
            overflow-x: hidden;
        }
        .focus-glow:focus-within {
            box-shadow: 0px 0px 12px rgba(255, 77, 0, 0.4);
        }
        .bg-void {
            background-color: #0A0A0A;
        }
        .bg-card {
            background-color: #1A1A1A;
        }
        .coral-accent {
            background-color: #FF4D00;
        }
        .border-coral {
            border-color: #FF4D00;
        }
        .text-coral {
            color: #FF4D00;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-void min-h-screen flex flex-col items-center justify-between font-body-md">
<!-- Top AppBar Style Header (Shell Context: Transactional - No Nav Shell) -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-center items-center px-margin h-16 bg-transparent">
<span class="font-display-lg-mobile text-display-lg-mobile text-primary-container tracking-tighter uppercase">NotWhat</span>
</header>
<!-- Main Content Area -->
<main class="w-full max-w-[390px] flex-grow flex flex-col px-margin pt-24 pb-12">
<!-- Welcome Heading -->
<div class="mb-10">
<h1 class="font-headline-md text-[32px] leading-tight text-on-surface mb-2">Welcome Back</h1>
<p class="font-body-md text-on-surface-variant opacity-70">Sign in to sync your bargains and feed.</p>
</div>
<!-- Form Section -->
<div class="space-y-6">
<!-- Email Input -->
<div class="space-y-2">
<label class="font-label-md text-on-surface-variant ml-1">Email</label>
<div class="relative focus-glow rounded-xl transition-all duration-300">
<input class="w-full bg-card border-none rounded-xl h-14 px-4 text-on-surface placeholder:text-on-surface-variant/40 focus:ring-2 focus:ring-primary-container outline-none transition-all" placeholder="you@example.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<label class="font-label-md text-on-surface-variant ml-1">Password</label>
<div class="relative focus-glow rounded-xl transition-all duration-300">
<input class="w-full bg-card border-none rounded-xl h-14 px-4 pr-12 text-on-surface placeholder:text-on-surface-variant/40 focus:ring-2 focus:ring-primary-container outline-none transition-all" id="password-input" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-primary-container font-label-md active:scale-95 transition-transform" onclick="togglePassword()" type="button">
                        SHOW
                    </button>
</div>
</div>
<!-- Forgot Password -->
<div class="flex justify-end">
<a class="font-label-md text-primary-container hover:opacity-80 transition-opacity" href="#">Forgot Password?</a>
</div>
<!-- Log In Button -->
<button class="w-full h-14 coral-accent rounded-full text-white font-headline-sm flex items-center justify-center shadow-lg active:scale-[0.98] transition-all duration-100">
                Log In
            </button>
<!-- Divider -->
<div class="flex items-center gap-4 py-2">
<div class="flex-grow h-[1px] bg-outline-variant/30"></div>
<span class="font-caption text-on-surface-variant/50 uppercase tracking-widest">or continue with</span>
<div class="flex-grow h-[1px] bg-outline-variant/30"></div>
</div>
<!-- Social Sign-In -->
<button class="w-full h-14 border-[1.5px] border-white/20 rounded-full text-white font-label-md flex items-center justify-center gap-3 active:scale-[0.98] hover:bg-white/5 transition-all">
<svg fill="currentColor" height="20" viewbox="0 0 24 24" width="20">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-1 .67-2.28 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.67-.35-1.39-.35-2.09s.13-1.42.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 1.2-4.53z" fill="#EA4335"></path>
</svg>
                Google
            </button>
</div>
</main>
<!-- Footer Links -->
<footer class="w-full pb-10 flex flex-col items-center">
<p class="font-body-md text-on-surface-variant">
            New here? <a class="text-primary-container font-label-md ml-1 hover:underline" href="#">Create Account</a>
</p>
</footer>
<!-- Atmosphere Background Elements -->
<div class="fixed inset-0 pointer-events-none z-[-1] overflow-hidden">
<!-- Subtle noise and glow -->
<div class="absolute -top-[10%] -right-[10%] w-[300px] h-[300px] rounded-full bg-primary-container/10 blur-[100px]"></div>
<div class="absolute bottom-[5%] -left-[10%] w-[400px] h-[400px] rounded-full bg-tertiary-container/5 blur-[120px]"></div>
</div>
<script>
        function togglePassword() {
            const input = document.getElementById('password-input');
            const btn = event.target;
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = 'HIDE';
            } else {
                input.type = 'password';
                btn.textContent = 'SHOW';
            }
        }

        // Add visual haptic feedback to buttons
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('touchstart', () => {
                button.classList.add('scale-95');
            });
            button.addEventListener('touchend', () => {
                button.classList.remove('scale-95');
            });
        });
    </script>
</body></html>
