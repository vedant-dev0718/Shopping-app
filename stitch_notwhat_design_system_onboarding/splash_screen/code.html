<style>
        @keyframes loading-bar {
            0% { transform: translateX(-100%); }
            50% { transform: translateX(0%); }
            100% { transform: translateX(100%); }
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; filter: blur(8px); }
            50% { opacity: 1; filter: blur(12px); }
        }

        @keyframes reveal {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .animate-loading {
            animation: loading-bar 2s cubic-bezier(0.65, 0, 0.35, 1) infinite;
        }

        .animate-reveal {
            animation: reveal 1s ease-out forwards;
        }

        .glow-accent {
            box-shadow: 0 0 15px #FF4D00;
        }
        
        body {
            background-color: #0A0A0A;
            color: white;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col items-center justify-center min-h-screen">
<!-- Background Atmospheric Effect -->
<div class="fixed inset-0 pointer-events-none overflow-hidden">
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[150%] h-[150%] opacity-20">
<div class="w-full h-full bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-[#FF4D00]/20 via-transparent to-transparent"></div>
</div>
</div>
<!-- Main Content Container -->
<main class="relative z-10 flex flex-col items-center text-center px-margin animate-reveal">
<!-- Brand Identity Block -->
<div class="mb-6 relative group">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-white tracking-tighter uppercase mb-2">
                NotWhat
            </h1>
<!-- Electric Coral Underline -->
<div class="h-[6px] w-full bg-[#FF4D00] rounded-full relative overflow-hidden">
<div class="absolute inset-0 bg-white/30 animate-pulse"></div>
</div>
<!-- Glow Blur Behind Logo -->
<div class="absolute -inset-4 bg-[#FF4D00]/10 blur-2xl rounded-full -z-10 animate-pulse"></div>
</div>
<!-- Tagline -->
<div class="space-y-1 opacity-0 animate-reveal" style="animation-delay: 0.3s;">
<p class="font-headline-sm text-headline-sm text-white/90 tracking-wide uppercase">
                Discover. Bargain. Buy.
            </p>
</div>
</main>
<!-- Bottom Loading Section -->
<div class="fixed bottom-16 left-0 right-0 px-12 flex flex-col items-center space-y-6">
<!-- Loading Progress Bar -->
<div class="w-full max-w-[240px] h-[2px] bg-white/10 rounded-full overflow-hidden relative">
<div class="absolute top-0 left-0 h-full w-full bg-[#FF4D00] animate-loading glow-accent"></div>
</div>
<!-- Semantic Interaction Hint (Pulse) -->
<div class="flex items-center space-x-2 text-white/40 font-label-md text-label-md uppercase tracking-[0.2em] opacity-0 animate-reveal" style="animation-delay: 0.6s;">
<span>Initializing Marketplace</span>
</div>
</div>
<!-- Micro-interaction Script -->
<script>
        // Simple logic to simulate loading completion and transition if needed
        document.addEventListener('DOMContentLoaded', () => {
            console.log('NotWhat Splash Initialized');
            
            // Add a subtle mouse move effect to the background glow
            document.addEventListener('mousemove', (e) => {
                const x = e.clientX / window.innerWidth;
                const y = e.clientY / window.innerHeight;
                
                const glow = document.querySelector('.bg-\\[radial-gradient\\]');
                if (glow) {
                    glow.style.transform = `translate(${(x - 0.5) * 20}px, ${(y - 0.5) * 20}px)`;
                }
            });
        });
    </script>
</body></html>
